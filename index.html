<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>黑盒子數位觀測站 | Soros Journal Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #121820;
    --bg-panel: #18222d;
    --bg-card: #1e2834;
    --bg-card-hover: #263342;
    --accent: #c89d66;
    --accent-hover: #d9af7a;
    --text-main: #f2eee9;
    --text-muted: #9aa8b6;
    --border-color: #2a3847;
    --tag-bg: #23303e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Noto Sans TC', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Left Sidebar */
  #sidebar {
    width: 420px;
    background-color: var(--bg-panel);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-shadow: 4px 0 15px rgba(0,0,0,0.3);
    z-index: 10;
    transition: transform 0.3s ease;
  }

  .sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    background: linear-gradient(135deg, #18222d 0%, #1e2834 100%);
  }

  .sidebar-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .sidebar-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 14pt;
    font-weight: 700;
    color: var(--accent);
    margin: 0;
    letter-spacing: 1px;
  }

  .file-count-badge {
    background-color: var(--accent);
    color: #121820;
    font-size: 8pt;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 12px;
  }

  /* Search Bar */
  .search-box {
    position: relative;
    margin-bottom: 10px;
  }

  .search-input {
    width: 100%;
    background-color: #121820;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 8px 12px 8px 34px;
    color: var(--text-main);
    font-size: 9pt;
    outline: none;
  }

  .search-input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 10pt;
  }

  /* Tags Bar */
  .tags-container {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    max-height: 70px;
    overflow-y: auto;
  }

  .filter-tag {
    background-color: var(--tag-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    font-size: 7.5pt;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-tag:hover, .filter-tag.active {
    background-color: var(--accent);
    color: #121820;
    border-color: var(--accent);
    font-weight: 600;
  }

  /* Card List */
  .card-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .article-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .article-card:hover { border-color: var(--accent); }
  .article-card.active {
    background-color: #233140;
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .card-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .card-series {
    font-size: 7pt;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(200, 157, 102, 0.1);
    padding: 2px 5px;
    border-radius: 3px;
  }

  .card-date { font-size: 7pt; color: var(--text-muted); }

  .card-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 10pt;
    font-weight: 600;
    color: var(--text-main);
    line-height: 1.35;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 6px;
  }

  .card-tag-badge {
    font-size: 6.5pt;
    background: #121820;
    color: var(--text-muted);
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* Right Main Panel */
  #main-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background-color: var(--bg-dark);
    position: relative;
  }

  /* Top Navbar */
  .top-navbar {
    height: 60px;
    background-color: var(--bg-panel);
    border-bottom: 1px solid var(--border-color);
    padding: 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .audio-player-widget {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #121820;
    border: 1px solid var(--border-color);
    padding: 4px 10px;
    border-radius: 30px;
  }

  .play-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #121820;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .audio-select {
    background: #18222d;
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 8pt;
    outline: none;
  }

  .action-buttons { display: flex; gap: 8px; }

  .btn-external {
    background-color: var(--accent);
    color: #121820;
    font-weight: 600;
    font-size: 8pt;
    padding: 6px 12px;
    border-radius: 4px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .back-to-list-btn {
    display: none;
    background: var(--border-color);
    color: var(--text-main);
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 8pt;
    cursor: pointer;
    font-weight: 600;
  }

  /* PDF Viewer Area */
  .viewer-container {
    flex: 1;
    padding: 16px;
    background-color: #0d1218;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 6px;
    background: #ffffff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .placeholder-view {
    text-align: center;
    color: var(--text-muted);
    font-family: 'Noto Serif TC', serif;
  }
  .placeholder-view h2 { color: var(--accent); margin-bottom: 6px; font-size: 13pt; }

  @media (max-width: 768px) {
    body { position: relative; }
    #sidebar {
      width: 100%;
      position: absolute;
      left: 0;
      top: 60px;
      height: calc(100vh - 60px);
      z-index: 20;
      transition: transform 0.3s ease;
    }
    #sidebar.mobile-hidden { transform: translateX(-100%); }
    #main-panel {
      width: 100%;
      position: absolute;
      left: 0;
      top: 0;
      height: 100vh;
    }
    .top-navbar { padding: 0 10px; justify-content: space-between; }
    .audio-player-widget { padding: 3px 8px; gap: 6px; }
    .audio-select { max-width: 110px; font-size: 7.5pt; }
    .back-to-list-btn { display: inline-flex; align-items: center; gap: 3px; }
  }
</style>
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-row">
        <h1 class="sidebar-title">黑盒子數位觀測站</h1>
        <span class="file-count-badge" id="countBadge">載入中...</span>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜尋手札..." oninput="filterArticles()">
      </div>
      <div class="tags-container" id="tagsContainer"></div>
    </div>
    <div class="card-list" id="cardList"></div>
  </div>

  <!-- RIGHT MAIN PANEL -->
  <div id="main-panel">
    <div class="top-navbar">
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="back-to-list-btn" id="backBtn" onclick="returnToList()">← 文章清單</button>
        <div class="audio-player-widget">
          <button class="play-btn" id="playBtn" onclick="toggleAudio()">▶</button>
          <select id="bgmSelect" class="audio-select" onchange="changeMusic()">
            <option value="https://www.image2url.com/r2/default/audio/1787326558036-d679f42e-b042-494d-87e1-feee736b1ea6.mp3">沉浸配樂 A01</option>
          </select>
        </div>
      </div>
      <div class="action-buttons">
        <a href="#" id="openExternalPdf" target="_blank" class="btn-external">全螢幕 PDF ↗</a>
      </div>
    </div>
    <div class="viewer-container" id="viewerContainer">
      <div class="placeholder-view">
        <h2>請從左側選擇一篇黑盒子手札</h2>
        <p>解構未知的真相，在虛實交錯中沉浸閱讀。</p>
      </div>
    </div>
  </div>

<script>
  // 穩定的本地資料庫（對應你的 Excel 內容，以後每新增一篇直接在這裡加一行即可）
  const articles = [
    {
      date: "2026-08-21",
      series: "黑盒子手札",
      title: "【黑盒子手札】時間的複利與真實的富有：一場關於快與慢的經濟學對話",
      tags: ["經濟學", "松浦彌太郎"],
      pdf: "https://drive.google.com/file/d/1Fv2sWJn9AoTw4uIpaRDrN3RWaBur6dbx/preview",
      rawPdf: "https://drive.google.com/file/d/1Fv2sWJn9AoTw4uIpaRDrN3RWaBur6dbx/view?usp=sharing"
    },
    {
      date: "2026-04-20",
      series: "Isekai Waves",
      title: "90s 復古電台與白日夢的虛擬共鳴",
      tags: ["復古電台", "Lo-Fi"],
      pdf: "https://drive.google.com/file/d/sample_pdf_02/preview",
      rawPdf: "#"
    },
    {
      date: "2026-05-01",
      series: "Pixel World",
      title: "16-bit 像素世界探索：數位考古現場的解構",
      tags: ["像素美學", "遊戲設計"],
      pdf: "https://drive.google.com/file/d/sample_pdf_03/preview",
      rawPdf: "#"
    }
  ];

  let currentActiveTag = "全部";
  let currentArticleIndex = null;
  const audio = document.getElementById('bgmAudio');
  const playBtn = document.getElementById('playBtn');

  function initDashboard() {
    renderTags();
    renderCards(articles);
    if (articles.length > 0 && window.innerWidth > 768) {
      selectArticle(0);
    }
    audio.src = document.getElementById('bgmSelect').value;
  }

  function renderTags() {
    const tagsSet = new Set();
    articles.forEach(a => a.tags.forEach(t => tagsSet.add(t)));
    let html = `<div class="filter-tag ${currentActiveTag === '全部' ? 'active' : ''}" onclick="filterByTag('全部')">全部 (${articles.length})</div>`;
    tagsSet.forEach(tag => {
      const count = articles.filter(a => a.tags.includes(tag)).length;
      html += `<div class="filter-tag ${currentActiveTag === tag ? 'active' : ''}" onclick="filterByTag('${tag}')">${tag} (${count})</div>`;
    });
    document.getElementById('tagsContainer').innerHTML = html;
  }

  function renderCards(list) {
    const cardList = document.getElementById('cardList');
    document.getElementById('countBadge').innerText = `${list.length} 篇`;
    if (list.length === 0) {
      cardList.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 30px 0;">沒有找到手札</div>`;
      return;
    }
    let html = '';
    list.forEach((art) => {
      const globalIdx = articles.indexOf(art);
      const isSelected = globalIdx === currentArticleIndex;
      const tagBadges = art.tags.map(t => `<span class="card-tag-badge">${t}</span>`).join('');
      html += `
        <div class="article-card ${isSelected ? 'active' : ''}" onclick="selectArticle(${globalIdx})">
          <div class="card-meta-row">
            <span class="card-series">${art.series}</span>
            <span class="card-date">${art.date}</span>
          </div>
          <div class="card-title">${art.title}</div>
          <div class="card-tags">${tagBadges}</div>
        </div>
      `;
    });
    cardList.innerHTML = html;
  }

  function filterByTag(tag) {
    currentActiveTag = tag;
    renderTags();
    filterArticles();
  }

  function filterArticles() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = articles.filter(art => {
      const matchesTag = currentActiveTag === '全部' || art.tags.includes(currentActiveTag);
      const matchesQuery = art.title.toLowerCase().includes(query) || 
                           art.series.toLowerCase().includes(query) || 
                           art.tags.some(t => t.toLowerCase().includes(query));
      return matchesTag && matchesQuery;
    });
    renderCards(filtered);
  }

  function selectArticle(idx) {
    currentArticleIndex = idx;
    const art = articles[idx];
    filterArticles();

    const viewer = document.getElementById('viewerContainer');
    viewer.innerHTML = `<iframe src="${art.pdf}" title="${art.title}"></iframe>`;
    document.getElementById('openExternalPdf').href = art.rawPdf;

    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.add('mobile-hidden');
      document.getElementById('backBtn').style.display = 'inline-flex';
    }
  }

  function returnToList() {
    document.getElementById('sidebar').classList.remove('mobile-hidden');
    document.getElementById('backBtn').style.display = 'none';
  }

  function toggleAudio() {
    if (audio.paused) {
      audio.play();
      playBtn.innerText = "❚❚";
    } else {
      audio.pause();
      playBtn.innerText = "▶";
    }
  }

  function changeMusic() {
    audio.src = document.getElementById('bgmSelect').value;
    audio.play();
    playBtn.innerText = "❚❚";
  }

  window.onload = initDashboard;
</script>
</body>
</html>
